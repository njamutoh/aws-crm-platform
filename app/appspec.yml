# ─────────────────────────────────────────────────────────────
# appspec.yml — read by the CodeDeploy agent on EC2
# All hooks call deploy.sh with a different argument.
# ─────────────────────────────────────────────────────────────
version: 0.0
os: linux

files:
  - source: scripts/
    destination: /home/ec2-user/deploy/scripts/

permissions:
  - object: /home/ec2-user/deploy/scripts
    owner: ec2-user
    group: ec2-user
    mode: "755"
    type:
      - directory
  - object: /home/ec2-user/deploy/scripts
    pattern: "**"
    owner: ec2-user
    group: ec2-user
    mode: "755"
    type:
      - file

hooks:
  BeforeInstall:
    - location: scripts/deploy.sh
      timeout: 60
      runas: ec2-user

  AfterInstall:
    - location: scripts/deploy.sh
      timeout: 120
      runas: ec2-user

  ApplicationStart:
    - location: scripts/deploy.sh
      timeout: 60
      runas: ec2-user

  ValidateService:
    - location: scripts/deploy.sh
      timeout: 30
      runas: ec2-user
