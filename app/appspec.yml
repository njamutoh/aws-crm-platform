# ─────────────────────────────────────────────────────────────
# appspec.yml — read by the CodeDeploy agent on EC2
# All hooks call deploy.sh with a different argument.
# ─────────────────────────────────────────────────────────────
version: 0.0
os: linux

files:
  - source: deploy.sh
    destination: /home/ec2-user/deploy/

permissions:
  - object: /home/ec2-user/deploy/deploy.sh
    owner: ec2-user
    group: ec2-user
    mode: "755"
    type:
      - file

hooks:
  BeforeInstall:
    - location: deploy.sh
      command:  "/home/ec2-user/deploy/deploy.sh stop"
      timeout:  60
      runas:    ec2-user

  AfterInstall:
    - location: deploy.sh
      command:  "/home/ec2-user/deploy/deploy.sh pull"
      timeout:  120
      runas:    ec2-user

  ApplicationStart:
    - location: deploy.sh
      command:  "/home/ec2-user/deploy/deploy.sh start"
      timeout:  60
      runas:    ec2-user

  ValidateService:
    - location: deploy.sh
      command:  "/home/ec2-user/deploy/deploy.sh validate"
      timeout:  30
      runas:    ec2-user
