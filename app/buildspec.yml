# ─────────────────────────────────────────────────────────────
# buildspec.yml — runs inside AWS CodeBuild
#
# Set these in the CodeBuild project environment:
#   AWS_ACCOUNT_ID
#   AWS_REGION
#   ECR_REPO_NAME
# ─────────────────────────────────────────────────────────────
version: 0.2

phases:

  install:
    runtime-versions:
      nodejs: 20
    commands:
      - 'echo "=== INSTALL ==="'
      - 'cd "$CODEBUILD_SRC_DIR/app" && npm install'

  pre_build:
    commands:
      - 'echo "=== PRE-BUILD: Tests ==="'
      - 'cd "$CODEBUILD_SRC_DIR/app" && npm run test --if-present || true'
      - 'echo "=== PRE-BUILD: ECR login ==="'
      - 'IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c1-7)'
      - 'ECR_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPO_NAME"'
      - 'aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$ECR_URI"'

  build:
    commands:
      - 'echo "=== BUILD ==="'
      - 'docker build -t "$ECR_REPO_NAME:$IMAGE_TAG" "$CODEBUILD_SRC_DIR/app"'
      - 'docker tag "$ECR_REPO_NAME:$IMAGE_TAG" "$ECR_URI:$IMAGE_TAG"'
      - 'docker tag "$ECR_REPO_NAME:$IMAGE_TAG" "$ECR_URI:latest"'

  post_build:
    commands:
      - 'echo "=== POST-BUILD: Push ==="'
      - 'docker push "$ECR_URI:$IMAGE_TAG"'
      - 'docker push "$ECR_URI:latest"'
      - 'printf ''[{"name":"aws-crm-platform","imageUri":"%s"}]'' "$ECR_URI:$IMAGE_TAG" > imagedefinitions.json'
      - 'cp "$CODEBUILD_SRC_DIR/app/appspec.yml" appspec.yml'
      - 'mkdir -p scripts'
      - 'cp "$CODEBUILD_SRC_DIR/app/scripts/deploy.sh" scripts/deploy.sh'

artifacts:
  files:
    - imagedefinitions.json
    - appspec.yml
    - scripts/deploy.sh
  discard-paths: no
